<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Song ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #c4dae8;
      --butter: #feefb8;
      --cocoa: #432f2e;
      --cream: #fffaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.6) 0 2px, transparent 3px),
        var(--blue);
      color: var(--cocoa);
      font-family: "Mali", cursive;
      padding: 40px 20px;
    }

    .paper {
      max-width: 760px;
      margin: auto;
      background: var(--cream);
      padding: 45px 25px 55px;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(67,47,46,.18);
      position: relative;
    }

    .tape {
      position: absolute;
      width: 120px;
      height: 32px;
      background: rgba(254,239,184,.85);
      top: -15px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
    }

    .top {
      text-align: center;
      font-family: "Quicksand", sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 38px;
      font-weight: 600;
    }

    .subtitle {
      text-align: center;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .album {
      width: 260px;
      margin: 0 auto 30px;
      padding: 14px;
      background: white;
      box-shadow: 0 10px 25px rgba(67,47,46,.2);
      transform: rotate(-2deg);
    }

    .album img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .player {
      max-width: 500px;
      margin: auto;
      text-align: center;
    }

    .song-name {
      font-size: 21px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    button {
      border: none;
      background: var(--butter);
      color: var(--cocoa);
      font-family: "Mali", cursive;
      font-size: 17px;
      padding: 10px 25px;
      border-radius: 999px;
      cursor: pointer;
    }

    button:hover {
      transform: translateY(-2px);
    }

    input[type="range"] {
      width: 100%;
      margin: 20px 0 8px;
    }

    .time {
      display: flex;
      justify-content: space-between;
      font-family: "Quicksand", sans-serif;
      font-size: 13px;
    }

    .volume {
      margin-top: 15px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 40px;
      color: var(--cocoa);
      text-decoration: none;
      font-size: 15px;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 25px 12px;
      }

      .paper {
        padding: 35px 18px 45px;
      }

      h1 {
        font-size: 30px;
      }

      .album {
        width: 220px;
      }
    }
  </style>
</head>

<body>

  <div class="paper">

    <div class="tape"></div>

    <div class="top">OUR LITTLE STORY ♡</div>

    <h1>Our Song</h1>

    <div class="subtitle">
      เพลงที่ทำให้ฉันนึกถึงเธอเสมอ
    </div>

    <div class="album">
      <img src="assets/music/album-cover.jpg" alt="Our Song Album Cover">
    </div>

    <div class="player">

      <div class="song-name">
        Our Song ♡
      </div>

      <audio id="audio" src="assets/music/our-song.mp3"></audio>

      <button id="playBtn">▶ Play</button>

      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0"
      >

      <div class="time">
        <span id="current">0:00</span>
        <span id="duration">0:00</span>
      </div>

      <div class="volume">
        🔊
        <input
          type="range"
          id="volume"
          min="0"
          max="1"
          step="0.01"
          value="1"
        >
      </div>

    </div>

    <a class="back" href="ending.html">
      ไปหน้าสุดท้าย ♡
    </a>

  </div>

  <script>
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const progress = document.getElementById("progress");
    const current = document.getElementById("current");
    const duration = document.getElementById("duration");
    const volume = document.getElementById("volume");

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";

      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");

      return `${min}:${sec}`;
    }

    playBtn.addEventListener("click", function () {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = "❚❚ Pause";
      } else {
        audio.pause();
        playBtn.textContent = "▶ Play";
      }
    });

    audio.addEventListener("loadedmetadata", function () {
      duration.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("timeupdate", function () {
      if (audio.duration) {
        progress.value = (audio.currentTime / audio.duration) * 100;
      }

      current.textContent = formatTime(audio.currentTime);
    });

    progress.addEventListener("input", function () {
      if (audio.duration) {
        audio.currentTime =
          (progress.value / 100) * audio.duration;
      }
    });

    volume.addEventListener("input", function () {
      audio.volume = volume.value;
    });

    audio.addEventListener("ended", function () {
      playBtn.textContent = "▶ Play";
      progress.value = 0;
    });
  </script>

</body>
</html>
