<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Story ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #c4dae8;
      --butter: #feefb8;
      --cocoa: #432f2e;
      --cream: #fffaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--blue);
      color: var(--cocoa);
      font-family: "Mali", cursive;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px;
    }

    .paper {
      position: relative;

      width: min(760px, 100%);

      background: var(--cream);

      padding: 45px 35px 55px;

      text-align: center;

      box-shadow:
        0 18px 40px rgba(67, 47, 46, 0.15),
        0 3px 0 rgba(67, 47, 46, 0.08);

      transform: rotate(-0.5deg);
    }

    .tape {
      position: absolute;
      top: -17px;
      left: 50%;

      transform: translateX(-50%) rotate(-2deg);

      width: 150px;
      height: 38px;

      background: rgba(254, 239, 184, 0.9);
    }

    .label {
      font-family: "Quicksand", sans-serif;

      font-size: 12px;
      letter-spacing: 3px;

      opacity: 0.55;

      margin-bottom: 25px;
    }

    .photo {
      width: min(420px, 90%);
      margin: 0 auto 28px;

      padding: 10px 10px 30px;

      background: white;

      box-shadow: 0 10px 25px rgba(67, 47, 46, 0.13);

      transform: rotate(-2deg);
    }

    .photo img {
      display: block;

      width: 100%;
      aspect-ratio: 4 / 3;

      object-fit: cover;
    }

    .photo-caption {
      margin-top: 10px;

      font-size: 13px;

      opacity: 0.55;
    }

    h1 {
      margin: 10px 0 5px;

      font-size: clamp(30px, 7vw, 52px);

      font-weight: 600;

      line-height: 1.25;
    }

    .question {
      margin: 0 0 28px;

      font-size: clamp(17px, 4vw, 22px);

      opacity: 0.8;
    }

    .buttons {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 14px;

      min-height: 60px;
    }

    button {
      border: 0;

      padding: 12px 24px;

      border-radius: 999px;

      font-family: "Mali", cursive;

      font-size: 15px;

      cursor: pointer;

      transition: transform 0.15s;
    }

    .yes {
      background: var(--butter);
      color: var(--cocoa);
    }

    .yes:hover {
      transform: scale(1.05);
    }

    .no {
      position: relative;

      background: #eee1dd;
      color: var(--cocoa);
    }

    .no:hover {
      position: fixed;
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .paper {
        padding: 40px 20px 45px;
      }

      .photo {
        width: 95%;
      }
    }
  </style>
</head>

<body>

  <main class="paper">

    <div class="tape"></div>

    <div class="label">
      OUR LITTLE STORY ♡
    </div>

    <div class="photo">
      <img src="assets/images/hero.jpg" alt="Our photo">

      <div class="photo-caption">
        a little piece of us ♡
      </div>
    </div>

    <h1>
      เรามีอะไรจะบอก
    </h1>

    <p class="question">
      อยากรู้ไหม?
    </p>

    <div class="buttons">

      <button class="yes" onclick="goNext()">
        อยากรู้สิ ♡
      </button>

      <button class="no" id="noButton">
        ไม่
      </button>

    </div>

  </main>

  <script>
    function goNext() {
      window.location.href = "anniversary.html";
    }

    const noButton = document.getElementById("noButton");

    function moveButton() {
      const maxX = window.innerWidth - noButton.offsetWidth - 20;
      const maxY = window.innerHeight - noButton.offsetHeight - 20;

      const x = Math.max(10, Math.random() * maxX);
      const y = Math.max(10, Math.random() * maxY);

      noButton.style.position = "fixed";
      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    noButton.addEventListener("mouseenter", moveButton);
    noButton.addEventListener("touchstart", moveButton);
    noButton.addEventListener("click", moveButton);
  </script>

</body>
</html>
