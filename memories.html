<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --blue: #c4dae8;
      --butter: #feefb8;
      --cocoa: #432f2e;
      --cream: #fffaf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 18px;

      min-height: 100vh;

      background: var(--blue);

      color: var(--cocoa);

      font-family: "Mali", cursive;
    }

    .paper {
      position: relative;

      width: min(900px, 100%);

      margin: 0 auto;

      background: var(--cream);

      padding: 55px 30px 60px;

      box-shadow: 0 18px 40px rgba(67, 47, 46, 0.15);

      transform: rotate(0.2deg);
    }

    .tape {
      position: absolute;

      top: -18px;
      left: 50%;

      transform: translateX(-50%) rotate(2deg);

      width: 150px;
      height: 38px;

      background: rgba(254, 239, 184, 0.9);
    }

    .label {
      text-align: center;

      font-family: "Quicksand", sans-serif;

      font-size: 12px;

      letter-spacing: 3px;

      opacity: 0.55;

      margin-bottom: 10px;
    }

    h1 {
      text-align: center;

      margin: 0 0 40px;

      font-size: clamp(32px, 7vw, 52px);

      font-weight: 600;
    }

    .memories {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 28px;

      max-width: 760px;

      margin: auto;
    }

    .memory {
      background: white;

      padding: 10px 10px 22px;

      box-shadow: 0 9px 22px rgba(67, 47, 46, 0.13);
    }

    .memory:nth-child(1) {
      transform: rotate(-2deg);
    }

    .memory:nth-child(2) {
      transform: rotate(2deg);
    }

    .memory:nth-child(3) {
      transform: rotate(1deg);
    }

    .memory:nth-child(4) {
      transform: rotate(-1.5deg);
    }

    .memory:nth-child(5) {
      transform: rotate(2deg);
    }

    .memory:nth-child(6) {
      transform: rotate(-2deg);
    }

    .memory img {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;
    }

    .caption {
      margin-top: 10px;

      text-align: center;

      font-size: 14px;

      opacity: 0.65;
    }

    .next {
      display: block;

      width: fit-content;

      margin: 45px auto 0;

      padding: 11px 23px;

      border: 1.5px solid var(--cocoa);

      border-radius: 999px;

      color: var(--cocoa);

      text-decoration: none;

      font-family: "Quicksand", sans-serif;

      font-size: 13px;

      transition: 0.2s;
    }

    .next:hover {
      background: var(--cocoa);

      color: var(--cream);
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 12px;
      }

      .paper {
        padding: 45px 18px 50px;
      }

      .memories {
        grid-template-columns: 1fr;

        gap: 30px;
      }
    }
  </style>
</head>

<body>

  <main class="paper">

    <div class="tape"></div>

    <div class="label">
      LITTLE MOMENTS
    </div>

    <h1>
      Our Memories ♡
    </h1>

    <div class="memories">

      <div class="memory">
        <img src="assets/images/memory-01.jpg" alt="Our Memory 1">

        <div class="caption">
          a little moment with you ♡
        </div>
      </div>

      <div class="memory">
        <img src="assets/images/memory-02.jpg" alt="Our Memory 2">

        <div class="caption">
          one of my favorite days
        </div>
      </div>

      <div class="memory">
        <img src="assets/images/memory-03.jpg" alt="Our Memory 3">

        <div class="caption">
          just us
        </div>
      </div>

      <div class="memory">
        <img src="assets/images/memory-04.jpg" alt="Our Memory 4">

        <div class="caption">
          another little memory ♡
        </div>
      </div>

      <div class="memory">
        <img src="assets/images/memory-05.jpg" alt="Our Memory 5">

        <div class="caption">
          moments I want to keep
        </div>
      </div>

      <div class="memory">
        <img src="assets/images/memory-06.jpg" alt="Our Memory 6">

        <div class="caption">
          always worth remembering ♡
        </div>
      </div>

    </div>

    <a href="letter.html" class="next">
      ไปต่อ → Love Letter
    </a>

  </main>

</body>
</html>
